<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{GAME_TITLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { margin-bottom: 4px; font-size: 1.6rem; }
  .subtitle { font-size: 0.85rem; margin-bottom: 16px; }
  .info-bar {
    display: flex; gap: 24px; margin-bottom: 12px;
    font-size: 0.95rem;
  }
  .info-bar span { font-weight: bold; }
  #game-grid {
    display: grid; gap: 1px;
    border: 2px solid; border-radius: 4px;
    margin-bottom: 16px;
  }
  .cell {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; transition: background 0.1s;
  }
  .controls {
    display: flex; gap: 12px; margin-bottom: 12px;
  }
  button {
    padding: 8px 20px; border: 1px solid; background: transparent;
    border-radius: 4px; cursor: pointer; font-size: 0.9rem;
    transition: all 0.15s;
  }
  button:hover { opacity: 0.8; }
  .message {
    font-size: 1.2rem; font-weight: bold;
    min-height: 2em; text-align: center;
  }
  .mechanic-badge {
    font-size: 0.75rem; padding: 2px 10px; border-radius: 10px;
    margin-bottom: 12px; display: inline-block;
  }
  .touch-controls {
    display: none; margin-top: 12px;
  }
  .touch-controls button { width: 56px; height: 56px; font-size: 1.4rem; }
  .touch-row { display: flex; justify-content: center; gap: 4px; margin: 2px 0; }
  @media (max-width: 600px) {
    .cell { width: 32px; height: 32px; font-size: 1rem; }
    .touch-controls { display: block; }
  }
  .footer {
    margin-top: 24px; font-size: 0.75rem; text-align: center; opacity: 0.5;
  }
</style>
</head>
<body>

<h1 id="game-title">{{GAME_TITLE}}</h1>
<p class="subtitle" id="game-subtitle">A PuzzleForge-generated puzzle</p>
<div class="mechanic-badge" id="mechanic-badge"></div>

<div class="info-bar">
  <div>Level: <span id="level-num">1</span> / <span id="total-levels">5</span></div>
  <div>Moves: <span id="moves">0</span></div>
  <div>Pushes: <span id="pushes">0</span></div>
</div>

<div id="game-grid"></div>

<div class="controls">
  <button onclick="undo()">Undo (Z)</button>
  <button onclick="resetLevel()">Reset (R)</button>
  <button onclick="prevLevel()">&larr; Prev</button>
  <button onclick="nextLevel()">Next &rarr;</button>
</div>

<div class="message" id="message"></div>

<div class="touch-controls">
  <div class="touch-row"><button onclick="move(0,-1)">Up</button></div>
  <div class="touch-row">
    <button onclick="move(-1,0)">&larr;</button>
    <button onclick="move(0,1)">Down</button>
    <button onclick="move(1,0)">&rarr;</button>
  </div>
</div>

<div class="footer">
  Generated by PuzzleForge - Agentic Puzzle Game Design System<br>
  CMU Heinz College - Agentic Systems Studio - 94-815
</div>

<script>
const CONFIG = {{GAME_CONFIG_JSON}};
const levels = CONFIG.levels;
const mechanic = CONFIG.primary_mechanic || "push";

// Theme configuration
const THEMES = {
  dark:   { bg: '#1a1a2e', fg: '#e0e0e0', accent: '#e94560', wall: '#16213e', floor: '#1a1a2e', grid: '#0f3460', target_glow: '#e9456044', box_on: '#0f9b58', player: '#4cc9f0', sub: '#888', info: '#aaa', win: '#0f9b58' },
  earthy: { bg: '#2c1810', fg: '#f0e6d3', accent: '#d4843e', wall: '#4a3728', floor: '#352318', grid: '#5c3d2e', target_glow: '#d4843e44', box_on: '#6b8e23', player: '#daa520', sub: '#a08060', info: '#c0a080', win: '#6b8e23' },
  icy:    { bg: '#0a1628', fg: '#e8f4f8', accent: '#5bc0eb', wall: '#1a3050', floor: '#0d1f3c', grid: '#2a4a6b', target_glow: '#5bc0eb44', box_on: '#48c774', player: '#ffd166', sub: '#7090a0', info: '#90b8d0', win: '#48c774' },
  gothic: { bg: '#1a0a2e', fg: '#e0d0f0', accent: '#9b59b6', wall: '#2d1b4e', floor: '#1a0a2e', grid: '#3d2b5e', target_glow: '#9b59b644', box_on: '#27ae60', player: '#f39c12', sub: '#806090', info: '#b090d0', win: '#27ae60' },
  space:  { bg: '#0a0e1a', fg: '#c8d6e5', accent: '#00d2d3', wall: '#1a2040', floor: '#0a0e1a', grid: '#1e3050', target_glow: '#00d2d344', box_on: '#10ac84', player: '#feca57', sub: '#607080', info: '#8899aa', win: '#10ac84' },
};

const td = CONFIG.theme_details || {};
const colorScheme = td.color_scheme || "dark";
const theme = THEMES[colorScheme] || THEMES.dark;

// Entity display
const PLAYER_ICON = td.player_emoji || "P";
const BOX_ICON = td.box_emoji || "B";
const TARGET_ICON = td.target_emoji || "X";
const WALL_ICON = td.wall_emoji || "";
const WIN_MSG = td.win_message || "Level complete!";
const BOX_NAME = td.box_name || "box";
const PLAYER_NAME = td.player_name || "player";

// Apply theme colors
document.body.style.background = theme.bg;
document.body.style.color = theme.fg;
document.querySelector('h1').style.color = theme.accent;
document.querySelector('.subtitle').style.color = theme.sub;
document.querySelectorAll('.info-bar').forEach(e => e.style.color = theme.info);

// Style buttons
function styleButtons() {
  document.querySelectorAll('button').forEach(b => {
    b.style.borderColor = theme.accent;
    b.style.color = theme.accent;
  });
  document.querySelectorAll('.info-bar span').forEach(s => {
    s.style.color = theme.accent;
  });
}

// Mechanic badge
const badge = document.getElementById('mechanic-badge');
badge.textContent = mechanic === "slide" ? "SLIDE MECHANIC" : "PUSH MECHANIC";
badge.style.border = '1px solid ' + theme.accent;
badge.style.color = theme.accent;

// Set subtitle
const subtitle = document.getElementById('game-subtitle');
if (mechanic === "slide") {
  subtitle.textContent = PLAYER_NAME.charAt(0).toUpperCase() + PLAYER_NAME.slice(1) + "s slide " + BOX_NAME + "s until they hit a wall";
} else {
  subtitle.textContent = PLAYER_NAME.charAt(0).toUpperCase() + PLAYER_NAME.slice(1) + " pushes " + BOX_NAME + "s to " + (td.target_name || "target") + "s";
}

let currentLevel = 0;
let grid, playerPos, moveCount, pushCount, history, won;

function initLevel(idx) {
  currentLevel = idx;
  const lvl = levels[idx];
  const W = lvl.grid_width, H = lvl.grid_height;
  const wallSet = new Set(lvl.walls.map(w => w[0]+','+w[1]));
  const boxList = lvl.boxes.map(b => [b[0], b[1]]);
  const targetSet = new Set(lvl.targets.map(t => t[0]+','+t[1]));

  grid = { W, H, walls: wallSet, boxes: boxList, targets: targetSet };
  playerPos = [lvl.player_start[0], lvl.player_start[1]];
  moveCount = 0; pushCount = 0; history = []; won = false;

  document.getElementById('level-num').textContent = idx + 1;
  document.getElementById('total-levels').textContent = levels.length;
  document.getElementById('message').textContent = '';
  render();
  styleButtons();
}

function render() {
  const el = document.getElementById('game-grid');
  el.style.gridTemplateColumns = `repeat(${grid.W}, 44px)`;
  el.style.borderColor = theme.accent;
  el.style.background = theme.grid;
  el.innerHTML = '';
  const boxSet = new Set(grid.boxes.map(b => b[0]+','+b[1]));

  for (let y = 0; y < grid.H; y++) {
    for (let x = 0; x < grid.W; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const key = x+','+y;
      const isWall = grid.walls.has(key);
      const isBox = boxSet.has(key);
      const isTarget = grid.targets.has(key);
      const isPlayer = playerPos[0]===x && playerPos[1]===y;

      if (isWall) {
        cell.style.background = theme.wall;
        cell.textContent = WALL_ICON;
      } else if (isPlayer && isTarget) {
        cell.style.background = theme.player;
        cell.style.borderRadius = '50%';
        cell.style.boxShadow = 'inset 0 0 12px ' + theme.target_glow + ', 0 2px 8px ' + theme.player + '66';
        cell.textContent = PLAYER_ICON;
      } else if (isPlayer) {
        cell.style.background = theme.player;
        cell.style.borderRadius = '50%';
        cell.style.boxShadow = '0 2px 8px ' + theme.player + '66';
        cell.textContent = PLAYER_ICON;
      } else if (isBox && isTarget) {
        cell.style.background = theme.box_on;
        cell.style.borderRadius = '6px';
        cell.style.boxShadow = '0 2px 8px ' + theme.box_on + '66';
        cell.textContent = BOX_ICON;
      } else if (isBox) {
        cell.style.background = theme.accent;
        cell.style.borderRadius = '6px';
        cell.style.boxShadow = '0 2px 8px ' + theme.accent + '66';
        cell.textContent = BOX_ICON;
      } else if (isTarget) {
        cell.style.background = theme.floor;
        cell.style.boxShadow = 'inset 0 0 12px ' + theme.target_glow;
        cell.textContent = TARGET_ICON;
      } else {
        cell.style.background = theme.floor;
      }
      el.appendChild(cell);
    }
  }
  document.getElementById('moves').textContent = moveCount;
  document.getElementById('pushes').textContent = pushCount;
}

function move(dx, dy) {
  if (won) return;
  const nx = playerPos[0]+dx, ny = playerPos[1]+dy;
  const key = nx+','+ny;
  if (grid.walls.has(key)) return;
  if (nx<0||nx>=grid.W||ny<0||ny>=grid.H) return;

  const boxSet = new Set(grid.boxes.map(b => b[0]+','+b[1]));
  let pushed = false;
  const oldBoxes = grid.boxes.map(b => [b[0],b[1]]);

  if (boxSet.has(key)) {
    if (mechanic === "slide") {
      // Slide: box slides until hitting wall or another box
      let bx = nx+dx, by = ny+dy;
      const bKey0 = bx+','+by;
      // Can the box move at all?
      if (grid.walls.has(bKey0) || bx<0||bx>=grid.W||by<0||by>=grid.H) return;
      // Check other boxes (excluding the one being pushed)
      const otherBoxSet = new Set(grid.boxes.filter(b => !(b[0]===nx && b[1]===ny)).map(b => b[0]+','+b[1]));
      if (otherBoxSet.has(bKey0)) return;
      // Slide until hitting something
      while (true) {
        const nextX = bx+dx, nextY = by+dy;
        const nextKey = nextX+','+nextY;
        if (nextX<0||nextX>=grid.W||nextY<0||nextY>=grid.H) break;
        if (grid.walls.has(nextKey)) break;
        if (otherBoxSet.has(nextKey)) break;
        bx = nextX; by = nextY;
      }
      for (let i=0; i<grid.boxes.length; i++) {
        if (grid.boxes[i][0]===nx && grid.boxes[i][1]===ny) {
          grid.boxes[i] = [bx, by]; pushed = true; break;
        }
      }
    } else {
      // Push: box moves exactly 1 tile
      const bx = nx+dx, by = ny+dy;
      const bKey = bx+','+by;
      if (grid.walls.has(bKey) || boxSet.has(bKey) || bx<0||bx>=grid.W||by<0||by>=grid.H) return;
      for (let i=0; i<grid.boxes.length; i++) {
        if (grid.boxes[i][0]===nx && grid.boxes[i][1]===ny) {
          grid.boxes[i] = [bx, by]; pushed = true; break;
        }
      }
    }
  }

  history.push({ px: playerPos[0], py: playerPos[1], boxes: oldBoxes, mc: moveCount, pc: pushCount });
  playerPos = [nx, ny];
  moveCount++;
  if (pushed) pushCount++;
  render();
  checkWin();
}

function checkWin() {
  const allOnTarget = grid.boxes.every(b => grid.targets.has(b[0]+','+b[1]));
  if (allOnTarget) {
    won = true;
    const msg = document.getElementById('message');
    msg.style.color = theme.win;
    if (currentLevel < levels.length - 1) {
      msg.textContent = WIN_MSG + ` (${moveCount} moves) - Press Next!`;
    } else {
      msg.textContent = `Congratulations! All levels completed!`;
    }
  }
}

function undo() {
  if (history.length === 0 || won) return;
  const prev = history.pop();
  playerPos = [prev.px, prev.py];
  grid.boxes = prev.boxes;
  moveCount = prev.mc; pushCount = prev.pc;
  render();
}

function resetLevel() { initLevel(currentLevel); }
function nextLevel() { if (currentLevel < levels.length-1) initLevel(currentLevel+1); }
function prevLevel() { if (currentLevel > 0) initLevel(currentLevel-1); }

document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp':    case 'w': case 'W': move(0,-1); e.preventDefault(); break;
    case 'ArrowDown':  case 's': case 'S': move(0,1);  e.preventDefault(); break;
    case 'ArrowLeft':  case 'a': case 'A': move(-1,0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': move(1,0);  e.preventDefault(); break;
    case 'z': case 'Z': undo(); break;
    case 'r': case 'R': resetLevel(); break;
    case 'n': case 'N': nextLevel(); break;
    case 'p': case 'P': prevLevel(); break;
  }
});

// Touch swipe support
let touchStart = null;
document.addEventListener('touchstart', e => { touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY}; });
document.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) { move(dx>0?1:-1, 0); } else { move(0, dy>0?1:-1); }
  touchStart = null;
});

// Start
initLevel(0);
</script>
</body>
</html>
